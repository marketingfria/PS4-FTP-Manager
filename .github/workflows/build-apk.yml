name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura Gradle
        run: |
          echo "=== Archivos del proyecto ==="
          ls -la
          echo "=== Proyectos Gradle ==="
          gradle projects

      - name: Mostrar tareas Android
        run: gradle :app:tasks --all

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar APK generado
        run: |
          echo "=== APK generado ==="
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4-FTP-Manager
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
